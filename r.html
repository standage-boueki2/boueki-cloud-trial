            <div class="rqp-q" style="border-top:0;padding-top:0"><label for="rqp_co">${E(T("co"))}</label><input type="text" id="rqp_co" autocomplete="organization" value="${E((S.ans && S.ans.co) || (S.req.to && S.req.to.co) || "")}"></div></div>
          ${q.map((x, i) => {
                const id = "rqpq" + i, v = A[x.k] != null ? A[x.k] : "", lab = RQP.pick(x.label, S.lg), help = RQP.pick(x.help, S.lg);

                return `<div class="rqp-q"><label for="${id}">${E(lab)}${x.req ? `<span class="rqp-rq">${E(T("req"))}</span>` : ""}</label>${help ? `<span class="rqp-help" id="${id}h">${E(help)}</span>` : ""}${inp}</div>`;
            }).join("")}
          ${fOn ? `<div class="rqp-q"><label>${E(RQP.pick(S.req.files.label, S.lg) || T("files"))}</label>${S.req.files.help ? `<span class="rqp-help">${E(RQP.pick(S.req.files.help, S.lg))}</span>` : ""}
            <div class="rqp-fz" id="rqpfz"><button type="button" class="rqp-b g s" id="rqpfb">${E(T("addf"))}</button> ${E(T("drop"))}<br><small>${E(T("fmax", fMax))}</small><input type="file" id="rqpfi" multiple hidden>
            <div class="rqp-fl">${S.files.map(f => `<div class="rqp-f"><span>${E((f.m && f.m.name) || f.id)}（${Math.max(1, Math.round(((f.m && f.m.size) || f.size || 0) / 1024))} KB）</span><button type="button" class="rqp-b g s" data-rmf="${E(f.id)}">${E(T("rmf"))}</button></div>`).join("")}</div></div></div>` : ""}
          <div class="rqp-q"><label for="rqp_note">${E(T("note"))}</label><textarea id="rqp_note">${E((S.ans && S.ans.note) || "")}</textarea></div>
          <p class="rqp-priv">${E(T("priv"))}${sent ? " " + E(T("sentNote")) : ""}</p>
          <div class="rqp-bar">${S.msg ? `<p class="rqp-msg ${S.msg[0]}" role="status">${E(S.msg[1])}</p>` : ""}
            <div class="rqp-prog"><span id="rqpprog"></span><span id="rqpleft"></span></div><div class="rqp-pb" aria-hidden="true"><i id="rqppb"></i></div>
            <div class="rqp-act">${sent ? "" : `<button type="button" class="rqp-b q" id="rqpsave">${E(T("save"))}</button>`}<button type="submit" class="rqp-b" id="rqpsend">${E(sent ? T("resend") : T("send"))}</button></div></div></form>
        <p class="rqp-brand">${E(T("pw"))}</p></div>`;
            el.querySelector("#rqplg").onchange = e => { S.lg = e.target.value; RQP.saveLang(S.lg); keep(); draw(); };
            {
                const fm = el.querySelector("#rqpf");
                const up = () => { keep(); paint(); };
                fm.addEventListener("input", up);
                fm.addEventListener("change", up);
                paint();
            }
            el.querySelector("#rqpf").onsubmit = e => { e.preventDefault(); go("sent"); };
            const sv = el.querySelector("#rqpsave");
            if (sv)
                sv.onclick = () => go("draft");
            if (fOn) {
                const fi = el.querySelector("#rqpfi"), fz = el.querySelector("#rqpfz");
                el.querySelector("#rqpfb").onclick = () => fi.click();
                fi.onchange = () => addFiles([...fi.files]);
                fz.addEventListener("dragover", e => { e.preventDefault(); fz.classList.add("on"); });
                fz.addEventListener("dragleave", () => fz.classList.remove("on"));
                fz.addEventListener("drop", e => { e.preventDefault(); fz.classList.remove("on"); addFiles([...(e.dataTransfer && e.dataTransfer.files || [])]); });
                el.querySelectorAll("[data-rmf]").forEach(b => b.onclick = async () => { if (S.busy)
                    return; S.busy = true; try {
                    const x = await io.fdel(b.dataset.rmf);
                    if (x && x.ok)
                        S.files = S.files.filter(f => f.id !== b.dataset.rmf);
                    else
                        S.msg = ["ng", EM(x)];
                }
                catch (e) {
                    S.msg = ["ng", T("err")];
                } S.busy = false; keep(); draw(); });
            }
        };
        const paint = () => {
            const p = RQP.count(S), raw = (k) => String((RQP_L[S.lg] || RQP_L.en)[k] || RQP_L.en[k] || k);
            const a = el.querySelector("#rqpprog"), l = el.querySelector("#rqpleft"), b = el.querySelector("#rqppb");
            if (a)
                a.innerHTML = E(raw("prog")).replace("{a}/{n}", `<b>${p.a}/${p.n}</b>`);
            if (l) {
                l.className = p.reqLeft ? "rqp-left" : "rqp-okall";
                l.textContent = p.reqLeft ? T("rql", p.reqLeft) : (p.req ? T("okall") : "");
            }
            if (b)
                b.style.width = (p.n ? Math.round(p.a / p.n * 100) : 0) + "%";
            const ol = el.querySelector("#rqpsteps");
            if (ol) {
                const st = RQP.stepOf(S), sent = S.state === "sent";
                [...ol.children].forEach((li, i) => { const ok = sent || st > i + 1, on = !sent && st === i + 1; li.className = ok ? "ok" : on ? "on" : ""; if (on)
                    li.setAttribute("aria-current", "step");
                else
                    li.removeAttribute("aria-current"); const n = li.querySelector(".n"); if (n)
                    n.textContent = ok ? "✓" : String(i + 1); });
            }
        };
        const keep = () => {
            const f = el.querySelector("#rqpf");
            if (!f)
                return;
            const a = {};
            f.querySelectorAll("[data-k]").forEach(x => { a[x.dataset.k] = x.value; });
            S.ans = Object.assign({}, S.ans || {}, { a, name: (f.querySelector("#rqp_name") || {}).value || "", co: (f.querySelector("#rqp_co") || {}).value || "", note: (f.querySelector("#rqp_note") || {}).value || "" });
        };
        const addFiles = async (list) => {
            keep();
            const max = (S.req.files && S.req.files.max) || 5;
            for (const f of list) {
                if (S.files.length >= max) {
                    S.msg = ["ng", T("fcnt", max)];
                    break;
                }
                if (f.size > 10 * 1024 * 1024) {
                    S.msg = ["ng", T("big") + (S.lg === "ja" || S.lg === "zh" ? "：" : ": ") + f.name];
                    continue;
                }
                S.msg = ["ok", T("upl")];
                draw();
                try {
                    const x = await io.fput(f);
                    if (x && x.ok)
                        S.files.push({ id: x.id, size: f.size, m: { name: f.name, type: f.type, size: f.size } });
                    else {
                        S.msg = ["ng", EM(x)];
                        if (x && (x.reason === "closed" || x.reason === "expired" || x.reason === "fcnt"))
                            break;
                    }
                }
                catch (e) {
                    S.msg = ["ng", T("err")];
                }
            }
            if (S.msg && S.msg[1] === T("upl"))
                S.msg = null;
            draw();
        };
        const go = async (state) => {
            if (S.busy)
                return;
            keep();
            const f = el.querySelector("#rqpf");
            let bad = false;
            f.querySelectorAll("[data-k]").forEach(x => { const q = (S.req.q || []).find(y => y.k === x.dataset.k); const no = state === "sent" && q && q.req && !String(x.value || "").trim(); x.classList.toggle("rqp-bad", !!no); x.setAttribute("aria-invalid", no ? "true" : "false"); if (no && !bad) {
                bad = true;
                x.focus();
            } });
            if (bad) {
                S.msg = ["ng", T("need")];
                const m = el.querySelector(".rqp-msg");
                if (m) {
                    m.className = "rqp-msg ng";
                    m.textContent = T("need");
                    return;
                }
                draw();
                const A2 = (S.ans && S.ans.a) || {};
                const k = (S.req.q || []).find(y => y.req && !String(A2[y.k] == null ? "" : A2[y.k]).trim());
                const x = k && [...el.querySelectorAll("[data-k]")].find(i => i.dataset.k === k.k);
                if (x) {
                    x.classList.add("rqp-bad");
                    x.setAttribute("aria-invalid", "true");
                    try {
                        x.focus({ preventScroll: true });
                        x.scrollIntoView({ block: "center" });
                    }
                    catch (e) { }
                }
                return;
            }
            S.busy = true;
            const b1 = el.querySelector("#rqpsend"), b2 = el.querySelector("#rqpsave");
            if (b1)
                b1.disabled = true;
            if (b2)
                b2.disabled = true;
            try {
                const x = await io.ans(Object.assign({}, S.ans, { lang: S.lg, files: S.files.map(f => ({ fid: f.id, name: f.m && f.m.name, size: f.m && f.m.size, type: f.m && f.m.type })), at: Date.now() }), state);
                if (x && x.ok) {
                    S.state = state;
                    S.msg = ["ok", state === "sent" ? T("sent") : T("saved")];
                }
                else
                    S.msg = ["ng", EM(x)];
            }
            catch (e) {
                S.msg = ["ng", T("err")];
            }
            S.busy = false;
            draw();
            try {
                el.scrollIntoView({ block: "end" });
            }
            catch (e) { }
        };
        draw();
    },
    count(S) {
        const q = (S.req && S.req.q) || [], A = (S.ans && S.ans.a) || {};
        let a = 0, req = 0, left = 0;
        q.forEach(x => { const v = String(A[x.k] == null ? "" : A[x.k]).trim(); if (v)
            a++; if (x.req) {
            req++;
            if (!v)
                left++;
        } });
        let n = q.length;
        if (S.req && S.req.files && S.req.files.on) {
            n++;
            if ((S.files || []).length)
                a++;
        }
        return { a, n, req, reqLeft: left };
    },
    stepOf(S) { if (S.state === "sent")
        return 3; const p = RQP.count(S); const nm = S.ans && (String(S.ans.name || "").trim() || String(S.ans.note || "").trim()); return (p.a || nm || S.state === "draft") ? 2 : 1; },
    navLang() { const l = String((navigator.languages && navigator.languages[0]) || navigator.language || "en").toLowerCase(); return l.startsWith("ja") ? "ja" : l.startsWith("zh") ? "zh" : l.startsWith("es") ? "es" : "en"; },
    savedLang() { try {
        return localStorage.getItem("rqp_lang") || "";
    }
    catch (e) {
        return "";
    } },
    saveLang(l) { try {
        localStorage.setItem("rqp_lang", l);
    }
    catch (e) { } },
    async boot(el, url) {
        const h = String(location.hash || "").replace(/^#/, ""), m = /^([0-9a-f]{32})\.([A-Za-z0-9_-]{40,60})$/.exec(h);
        if (!m) {
            RQP.mount(el, { get: async () => ({ ok: false, reason: "bad" }) });
            return;
        }
        const id = m[1];
        let key;
        try {
            key = await RQC.key(m[2]);
        }
        catch (e) {
            RQP.mount(el, { get: async () => ({ ok: false, reason: "bad" }) });
            return;
        }
        const call = async (op, b) => { const r = await fetch(url, { method: "POST", mode: "cors", redirect: "follow", headers: { "Content-Type": "text/plain;charset=UTF-8" }, body: JSON.stringify(Object.assign({ op, v: 1, t: Date.now(), id }, b || {})) }); return r.json(); };
        const io = {
            get: async () => {
                const r = await call("req_get");
                if (!r || !r.ok)
                    return r || { ok: false, reason: "none" };
                const req = await RQC.dec(key, r.enc);
                req.exp = r.exp || req.exp;
                let ans = null, state = "";
                if (r.ans && r.ans.enc) {
                    try {
                        ans = await RQC.dec(key, r.ans.enc);
                        state = r.ans.state;
                    }
                    catch (e) { }
                }
                const files = [];
                for (const f of (r.files || [])) {
                    let mm = null;
                    try {
                        mm = f.m ? await RQC.dec(key, f.m) : null;
                    }
                    catch (e) { }
                    files.push({ id: f.id, size: f.size, m: mm });
                }
                return { ok: true, req, ans, state, files };
            },
            ans: async (a, state) => call("req_ans", { enc: await RQC.enc(key, a), state }),
            fput: async (f) => {
                const fid = RQC.hex(16);
                const buf = await f.arrayBuffer();
                const blob = await RQC.encBuf(key, buf);
                const x = await call("req_fput", { fid, blob, m: await RQC.enc(key, { name: f.name, type: f.type, size: f.size }) });
                if (x && x.ok)
                    x.id = fid;
                return x;
            },
            fdel: async (fid) => call("req_fdel", { fid })
        };
        RQP.mount(el, io);
    }
